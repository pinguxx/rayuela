<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f1f06"/>
      <stop offset="50%" stop-color="#5c3008"/>
      <stop offset="100%" stop-color="#271206"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background / Clay bed -->
  <rect width="512" height="512" rx="96" fill="#1a0f08"/>
  <rect x="40" y="40" width="432" height="432" rx="48" fill="url(#clayGrad)" stroke="#78350f" stroke-width="12"/>

  <!-- Center Line (La Raya) -->
  <line x1="60" y1="256" x2="452" y2="256" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <line x1="60" y1="256" x2="452" y2="256" stroke="#f59e0b" stroke-width="24" stroke-linecap="round" opacity="0.3"/>

  <!-- Golden Rayuela Coin -->
  <circle cx="256" cy="256" r="130" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="8" filter="url(#dropShadow)"/>
  <circle cx="256" cy="256" r="105" fill="none" stroke="#78350f" stroke-width="4" stroke-dasharray="8 8"/>
  
  <!-- Coin Center Star / Eagle symbol -->
  <polygon points="256,180 278,230 332,236 292,272 304,326 256,298 208,326 220,272 180,236 234,230" fill="#fef08a" opacity="0.95"/>
</svg>
